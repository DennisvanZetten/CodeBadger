<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CodeBadger</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="lib/xterm/xterm.css" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="RepoLauncher.styles.css" />
    <link rel="icon" type="image/svg+xml" href="codebadger.svg">
    <script>
        window.repoLauncher = {
            setTheme: function (id, isDark, background, foreground, cursor, selectionBackground) {
                document.documentElement.dataset.theme = id;
                document.documentElement.dataset.themeMode = isDark ? "dark" : "light";
                document.documentElement.style.setProperty("--terminal-background", background);
                window.repoLauncherTerminalTheme = { isDark, background, foreground, cursor, selectionBackground };
                window.dispatchEvent(new CustomEvent("repo-launcher-theme-changed", { detail: window.repoLauncherTerminalTheme }));
            },
            setLanguage: function (language, translations) {
                document.documentElement.lang = language;
                document.querySelectorAll("[data-i18n]").forEach(function (element) {
                    var key = element.dataset.i18n;
                    element.textContent = translations[key] || key;
                });
            }
        };
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="startup-splash" role="status" aria-live="polite">
            <div class="startup-logo-halo">
                <img class="startup-logo" src="codebadger.svg" alt="" />
            </div>
            <h1 class="startup-title">CodeBadger</h1>
            <div class="startup-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
            <span class="startup-loading-label" data-i18n="Loading...">Loading...</span>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        <span data-i18n="An unhandled error has occurred.">An unhandled error has occurred.</span>
        <a href="." class="reload" data-i18n="Reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="notification-sounds.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="lib/xterm/xterm.js"></script>
    <script src="lib/xterm/addon-fit/addon-fit.js"></script>

</body>

</html>
