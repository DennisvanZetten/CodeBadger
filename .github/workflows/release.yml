name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Visual Studio MSIX tools
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Add public NuGet feed
        run: dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --ignore-failed-sources

      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Add the CODE_SIGNING_PFX_BASE64 and CODE_SIGNING_PFX_PASSWORD repository secrets before publishing a release."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "CodeBadger.pfx"
          $pfxBytes = [Convert]::FromBase64String(($env:SIGNING_PFX_BASE64 -replace '\s', ''))
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, $env:SIGNING_PFX_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          if ($certificate.Subject -ne 'CN=CodeBadger Local' -or -not $certificate.HasPrivateKey) {
            throw 'The PFX must contain the CodeBadger code-signing certificate and its private key.'
          }
          [IO.File]::WriteAllBytes($certificatePath, $pfxBytes)
          $certificate.Dispose()
          [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
          Remove-Variable pfxBytes
          "SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build signed MSIX
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must look like v1.2.3; got $env:GITHUB_REF_NAME"
          }
          $tagExists = git tag --list $env:GITHUB_REF_NAME
          if (-not $tagExists) {
            throw "The release tag $env:GITHUB_REF_NAME was not found in the checked-out source."
          }
          $highestExistingVersion = git tag --list 'v*' |
            Where-Object { $_ -ne $env:GITHUB_REF_NAME } |
            ForEach-Object { if ($_ -match '^v(\d+\.\d+\.\d+)$') { try { [version]$Matches[1] } catch { } } } |
            Sort-Object -Descending |
            Select-Object -First 1
          if ($highestExistingVersion -and [version]$version -le $highestExistingVersion) {
            throw "Release version $version must be greater than the highest existing release version $highestExistingVersion."
          }
          ./installer/Build-Installer.ps1 `
            -Version $version `
            -CertificatePath $env:SIGNING_CERTIFICATE_PATH `
            -CertificatePassword $env:SIGNING_PFX_PASSWORD
          $outputDirectory = Join-Path $PWD "artifacts/installer/$version"
          $setupZip = Join-Path $env:RUNNER_TEMP 'CodeBadger-Setup.zip'
          Compress-Archive -Path (Join-Path $outputDirectory '*') -DestinationPath $setupZip -Force
          Move-Item -LiteralPath $setupZip -Destination (Join-Path $outputDirectory 'CodeBadger-Setup.zip') -Force
          "RELEASE_OUTPUT_DIRECTORY=$outputDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $outputDirectory = $env:RELEASE_OUTPUT_DIRECTORY
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $outputDirectory 'CodeBadger.msix') `
            (Join-Path $outputDirectory 'CodeBadger.cer') `
            (Join-Path $outputDirectory 'CodeBadger-WindowsAppRuntime-x64.msix') `
            (Join-Path $outputDirectory 'CodeBadger-Setup.zip') `
            --title $env:GITHUB_REF_NAME `
            --generate-notes

      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:SIGNING_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force
          }
